name: Verify Final Chapter In Real Chromium
on:
  pull_request:
    paths:
      - 'src/chapter4*'
      - 'tests/browser-final.mjs'
      - 'package.json'
      - '.github/workflows/browser-final.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
